services:
  postgres:
    image: postgres:16-alpine
    container_name: onboarding-postgres
    environment:
      POSTGRES_DB: onboarding
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - onboarding-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: onboarding-redis
    ports:
      - "6379:6379"
    volumes:
      - onboarding-redisdata:/data

volumes:
  onboarding-pgdata:
  onboarding-redisdata:
